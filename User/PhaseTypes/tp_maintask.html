<!-- Time Perception main trial setup (wording of response text is different to training) -->
<!--
---development---
[
{'visual':'motherfucker','audio':'Screw','voice':'f', 'delay':'600', 'audio_time':'682'}
]
---development---
-->
<style>
  body, html {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: white;
  }
  img {
    max-width: 100%;
    max-height: 100%;
  }
  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 72pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: uppercase;
  }
  #response_options  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 16pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: none;
  }
  #stimuli_text, #delay_text, #response_options {
    display: none;
  }
  .no_mouse{
    cursor: none;
  }
  .response-hint {
    font-family: "Times New Roman", Times, serif;
    font-size: 12pt;
    color: #666;
    margin-top: 6px;
  }
</style>
<body class="no_mouse">
  <input type='hidden' id='response' name='response'/>
  <input type="hidden" id="sync-issue" name="sync_issue" value="0">
  
  <!--HTML-->
  <p id="fixation">+</p>
  
  <p id="stimuli_text">{{visual}}</p>
  <audio id="stimuli_audio" src="../../collector-experiments/User/Assets/timeperception/audio/main/{{audio}}_{{voice}}.mp3"></audio>
  
  <audio id="delay_audio" src="../../collector-experiments/User/Assets/timeperception/audio/200.mp3"></audio>
  <p id="delay_text">—</p>
  
  <div id="response_options" class="text-center">
      <p>Was the audio tone closer in length to the short (0.5 second) or long (1.5 second) tone you heard during the training trials?</p>
      <br><br>
      
      <div class="d-flex justify-content-center gap-4">
          <div class="text-center">
              <button id="response_short" class="btn btn-outline-primary btn-lg">Short</button>
              <div class="response-hint">(or press S)</div>
          </div>
          <div class="text-center">
              <button id="response_long" class="btn btn-outline-primary btn-lg">Long</button>
              <div class="response-hint">(or press L)</div>
          </div>
      </div>

</div>

  <!--JAVASCRIPT-->
  <script>
    var audio = '{{audio}}';
    var visual = '{{visual}}';
    var audio_time = '{{audio_time}}';
    var delay = '{{delay}}';

    var baselineTime;
    var sync_issue = false;  // Flag for timing or audio errors
    var audio_issue = false;
    var expectedTimes = {};  // Object to track expected timestamps

    function flagAudioIssue(audioName, error) {
        audio_issue = true;
        sync_issue = true;
        $("#sync-issue").val("1");
        console.warn(audioName + " failed to play:", error);
    }

    function playTrialAudio(audioElement, audioName) {
        var playPromise;

        try {
            playPromise = audioElement.play();
        } catch (error) {
            flagAudioIssue(audioName, error);
            return;
        }

        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function(error) {
                flagAudioIssue(audioName, error);
            });
        }
    }

    $('#stimuli_audio, #delay_audio').on('error', function() {
        flagAudioIssue(this.id, this.error || "Unknown media error");
    });

    Phase.set_timer(function() {
        baselineTime = Date.now();
        $("#sync-issue").val(audio_issue ? "1" : "0");
    }, 0);

    var runtime = Number(500);

    if (visual == "Control") {
        $('#stimuli_text').html("");
    }

    // Hide the fixation cross and display the first bookend stimuli
    Phase.set_timer(function() {
        $('#fixation').hide();
        $('#stimuli_text').show();
        if (audio !== "control") {
            playTrialAudio($('#stimuli_audio')[0], 'First stimulus audio');
        }
        expectedTimes.bookend1Start = Date.now();  // Store expected start time
    }, runtime);

    // Update runtime to include audio duration
    runtime += Number(audio_time) + 525;

    // Hide bookend stimuli and play delay tone
    Phase.set_timer(function() {
        $('#stimuli_text').hide();
        $('#delay_text').show();
        playTrialAudio($('#delay_audio')[0], 'Delay tone');
        expectedTimes.delayStart = Date.now();
    }, runtime);

    // Update runtime to include delay duration
    runtime += Number(delay);

    // Stop delay tone and hide visual dash
    Phase.set_timer(function() {
        $('#delay_text').hide();
        $('#delay_audio')[0].pause();
        $('#delay_audio')[0].currentTime = 0; // Ensure reset
        expectedTimes.delayEnd = Date.now();
    }, runtime);

    runtime += 25; // Small buffer for smoother transition

    // Redisplay bookend stimuli
    Phase.set_timer(function() {
        $('#stimuli_text').show();
        if (audio !== "control_m" && audio !== "control_f") {
            playTrialAudio($('#stimuli_audio')[0], 'Repeated stimulus audio');
        }
        expectedTimes.bookend2Start = Date.now();
    }, runtime);

    runtime += Number(audio_time);

    // Hide bookend stimuli
    Phase.set_timer(function() {
        $('#stimuli_text').hide();
        expectedTimes.bookend2End = Date.now();
    }, runtime);

    runtime += 25; // Small buffer

    // Display response option buttons
    Phase.set_timer(function() {
        $('body').removeClass('no_mouse');
        $('#response_options').show();
        checkSync(); // Check if timings were off
        responseEnabled = true;
    }, runtime);

    // Track whether response options are available
    var responseEnabled = false;
    var responseSubmitted = false;
    
    // Handle responses from either buttons or keyboard
    function submitResponse(answer) {
        if (!responseEnabled || responseSubmitted) return;
    
        responseSubmitted = true;
        responseEnabled = false;
    
        $('#response').val(answer);
    
        // Remove this trial's keyboard listeners before submitting
        removeKeyboardListeners();
    
        Phase.submit();
    }
    
    // Button responses
    $('#response_short').click(function() {
        submitResponse('short');
    });
    
    $('#response_long').click(function() {
        submitResponse('long');
    });
    
    // Keyboard responses can originate in any level of Collector's nested iframes
    var keyboardDocuments = [document];

    try {
        if (window.parent !== window) {
            keyboardDocuments.push(window.parent.document);
        }

        if (window.top !== window && window.top !== window.parent) {
            keyboardDocuments.push(window.top.document);
        }
    } catch (error) {
        console.warn("Parent keyboard access unavailable:", error);
    }

    function handleKeyboardResponse(e) {
        if (!responseEnabled || responseSubmitted) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        var key = (
            e.key ||
            String.fromCharCode(e.which || e.keyCode)
        ).toLowerCase();

        if (key === 's') {
            submitResponse('short');
        } else if (key === 'l') {
            submitResponse('long');
        }
    }

    function removeKeyboardListeners() {
        keyboardDocuments.forEach(function(keyboardDocument) {
            keyboardDocument.removeEventListener(
                'keydown',
                handleKeyboardResponse
            );
        });
    }

    keyboardDocuments.forEach(function(keyboardDocument) {
        keyboardDocument.addEventListener(
            'keydown',
            handleKeyboardResponse
        );
    });

    window.addEventListener('unload', removeKeyboardListeners);

    // Function to check sync issues
    function checkSync() {
        let errorMessages = [];

        // Check the intervals actually experienced during the trial
        let actualBookend1Interval =
            expectedTimes.delayStart - expectedTimes.bookend1Start;

        let actualToneDuration =
            expectedTimes.delayEnd - expectedTimes.delayStart;

        let actualBookendTransition =
            expectedTimes.bookend2Start - expectedTimes.delayEnd;

        let actualBookend2Interval =
            expectedTimes.bookend2End - expectedTimes.bookend2Start;

        if (Math.abs(actualBookend1Interval - (Number(audio_time) + 525)) > 50) {
            errorMessages.push("First bookend interval mismatch.");
        }

        if (Math.abs(actualToneDuration - Number(delay)) > 50) {
            errorMessages.push("Tone duration mismatch.");
        }

        if (Math.abs(actualBookendTransition - 25) > 50) {
            errorMessages.push("Second bookend transition mismatch.");
        }

        if (Math.abs(actualBookend2Interval - Number(audio_time)) > 50) {
            errorMessages.push("Second bookend interval mismatch.");
        }

        if (errorMessages.length > 0) {
            sync_issue = true;
            $("#sync-issue").val("1");
            console.warn("Trial sync issue detected:", errorMessages);
        }
    }
</script>
</body>
