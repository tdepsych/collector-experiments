<!-- Time Perception training trial setup (wording of response text is different to main) -->
<!--
---development---
[
{'visual':'Kettle','audio':'Sink','voice':'f', 'delay':'400', 'audio_time':'600'}
]
---development---
-->
<style>
  body, html {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: white;
  }
  img {
    max-width: 100%;
    max-height: 100%;
  }
  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 72pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: uppercase;
  }
  #response_options  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 16pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: none;
  }
  #stimuli_text, #delay_text, #response_options {
    display: none;
  }
  .no_mouse{
    cursor: none;
  }
  .response-hint {
    font-family: "Times New Roman", Times, serif;
    font-size: 12pt;
    color: #666;
    margin-top: 6px;
  }
  #block_progress {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 10px;
    background-color: #e9ecef;
    overflow: hidden;
    z-index: 1000;
  }
  #block_progress_fill {
    width: 0;
    height: 100%;
    background-color: #006599;
    transition: width 300ms ease-out;
  }
</style>
<body class="no_mouse" tabindex="-1">
  <input type='hidden' id='response' name='response'/>
  <input type="hidden" id="training_correct" name="training_correct"/>
  <input type="hidden" id="training_accuracy" name="training_accuracy"/>
  <input type="hidden" id="training_attempts" name="training_attempts"/>
  <input type="hidden" id="sync-issue" name="sync_issue" value="0">
  
  <div id="block_progress" role="progressbar" aria-label="Progress through the training trials" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="block_progress_fill"></div>
  </div>
  
  <!--HTML-->
  <p id="fixation">+</p>
  
  <p id="stimuli_text">{{visual}}</p>
  <audio id="stimuli_audio" preload="auto" src="https://www.swearingscience.co.uk/timeperception/audio/training/{{audio}}_{{voice}}.mp3"></audio>
  
  <audio id="delay_audio" preload="auto" src="https://www.swearingscience.co.uk/timeperception/audio/200.mp3"></audio>
  <p id="delay_text">—</p>
  
  <div id="response_options" class="text-center">
      <p>Did the audio tone last for a short (0.5 seconds) or long (1.5 seconds) length of time?</p>
      <br><br>

  <div class="d-flex justify-content-center gap-4">
      <div class="text-center">
          <button id="response_short" class="btn btn-outline-primary btn-lg">Short</button>
          <div class="response-hint">(or press S)</div>
      </div>
      <div class="text-center">
          <button id="response_long" class="btn btn-outline-primary btn-lg">Long</button>
          <div class="response-hint">(or press L)</div>
      </div>
  </div>

</div>
<div id="training_feedback" class="h2 fw-bold text-center" style="display: none;" aria-live="polite"></div> 
  <!--JAVASCRIPT-->
  <script>
    var audio = '{{audio}}';
    var visual = '{{visual}}';
    var audio_time = '{{audio_time}}';
    var delay = '{{delay}}';
    var trainingCorrectKey = 'tp_training_correct_count';
    var trainingTrialKey = 'tp_training_trial_count';
    var trainingAttemptKey = 'tp_training_attempt_count';
    

    function updateTrainingProgress() {
        var procedure =
            parent.parent.project_json.parsed_proc;
        var currentPhase = Number(Phase.phase_no);
        var currentRow = procedure[currentPhase];
        var phaseType = currentRow.phasetype;
        var blockStart = currentPhase;
        var blockEnd = currentPhase;

        function belongsToTrainingBlock(row) {
            return row &&
                row.phasetype === phaseType;
        }

        while (
            blockStart > 0 &&
            belongsToTrainingBlock(procedure[blockStart - 1])
        ) {
            blockStart -= 1;
        }

        while (
            blockEnd < procedure.length - 1 &&
            belongsToTrainingBlock(procedure[blockEnd + 1])
        ) {
            blockEnd += 1;
        }

        var trialNumber =
            currentPhase - blockStart + 1;
        var totalTrials =
            blockEnd - blockStart + 1;
        var progressPercentage = totalTrials > 1
            ? ((trialNumber - 1) / (totalTrials - 1)) * 100
            : 100;
        var previousProgressPercentage = totalTrials > 1
            ? Math.max(
                0,
                ((trialNumber - 2) / (totalTrials - 1)) * 100
            )
            : 100;
        var progressFill = $('#block_progress_fill');
        var phaseFrame = window.parent.frameElement;

        $('#block_progress').attr(
            'aria-valuenow',
            Math.round(progressPercentage)
        );

        function animateTrainingProgress() {
            progressFill.css({
                transition: 'none',
                width: previousProgressPercentage + '%'
            });

            progressFill[0].offsetWidth;

            window.requestAnimationFrame(function() {
                progressFill.css({
                    transition: 'width 300ms ease-out',
                    width: progressPercentage + '%'
                });
            });
        }

        if (
            !phaseFrame ||
            phaseFrame.style.visibility === 'visible'
        ) {
            animateTrainingProgress();
        } else {
            var phaseVisibilityObserver =
                new MutationObserver(function() {
                    if (
                        phaseFrame.style.visibility === 'visible'
                    ) {
                        phaseVisibilityObserver.disconnect();
                        animateTrainingProgress();
                    }
                });

            phaseVisibilityObserver.observe(
                phaseFrame,
                {
                    attributes: true,
                    attributeFilter: ['style']
                }
            );
        }
    }

    updateTrainingProgress();

    function getTrainingCount(key) {
        var studyVars = parent.parent.project_json.study_vars;

        if (
            typeof studyVars === 'undefined' ||
            typeof studyVars[key] === 'undefined'
        ) {
            return 0;
        }

        return Number(studyVars[key]) || 0;
    }

    function isFinalTrainingTrial() {
        var currentPhase = Number(Phase.phase_no);
        var nextPhase =
            parent.parent.project_json.parsed_proc[currentPhase + 1];

        return !nextPhase ||
            String(nextPhase.phasetype).toLowerCase() !== 'tp_training';
    }

    function finishTrainingResponse(correctCount, trialCount) {
        var accuracy = (correctCount / trialCount) * 100;

        $('#training_accuracy').val(accuracy);

        if (!isFinalTrainingTrial()) {
            Phase.submit();
            return;
        }

        Phase.set(trainingCorrectKey, 0);
        Phase.set(trainingTrialKey, 0);

        if (accuracy > 75) {
            Phase.go_to('+2');
        } else {
            Phase.submit();
        }
    }
    
    var audio_output_latency_ms = 0;

    try {
        audio_output_latency_ms =
            Number(Phase.get('audio_output_latency_ms')) || 0;
    } catch (error) {
        console.warn('No saved audio output latency was available:', error);
    }

    audio_output_latency_ms = Number.isFinite(audio_output_latency_ms)
        ? Math.max(audio_output_latency_ms, 0)
        : 0;
    
    console.log(
        'Training audio output latency compensation:',
        audio_output_latency_ms + 'ms'
    );

    var baselineTime;
    var sync_issue = false;  // Flag for timing or audio errors
    var audio_issue = false;
    var expectedTimes = {};  // Object to track expected timestamps

    function flagAudioIssue(audioName, error) {
        audio_issue = true;
        sync_issue = true;
        $("#sync-issue").val("1");
        console.warn(audioName + " failed to play:", error);
    }

    function playTrialAudio(audioElement, audioName) {
        var playPromise;

        try {
            playPromise = audioElement.play();
        } catch (error) {
            flagAudioIssue(audioName, error);
            return;
        }

        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function(error) {
                flagAudioIssue(audioName, error);
            });
        }
    }

    $('#stimuli_audio, #delay_audio').on('error', function() {
        flagAudioIssue(this.id, this.error || "Unknown media error");
    });

    Phase.set_timer(function() {
        baselineTime = Date.now();
        $("#sync-issue").val(audio_issue ? "1" : "0");
    }, 0);

    var responseEnabled = false;
    var responseSubmitted = false;
    var stimulusAudio = $('#stimuli_audio')[0];
    var delayAudio = $('#delay_audio')[0];
    var hasSpokenAudio =
        audio.toLowerCase() !== 'control';

    if (visual === 'Control') {
        $('#stimuli_text').html('');
    }

    function waitForTrialAudio(audioElements, callback) {
        var remaining = audioElements.length;

        function markAudioReady() {
            remaining -= 1;

            if (remaining === 0) {
                callback();
            }
        }

        audioElements.forEach(function(audioElement) {
            if (audioElement.readyState >= 4) {
                markAudioReady();
                return;
            }

            $(audioElement).one(
                'canplaythrough',
                markAudioReady
            );
            audioElement.load();
        });
    }

    function showResponseOptions() {
        $('body').removeClass('no_mouse');
        $('#response_options').show();
        checkSync();
        responseEnabled = true;

        window.focus();
        document.body.focus();
    }

    function showSecondBookend() {
        $('#stimuli_text').show();
        expectedTimes.bookend2Start = Date.now();

        window.setTimeout(function() {
            $('#stimuli_text').hide();
            expectedTimes.bookend2End = Date.now();

            window.setTimeout(
                showResponseOptions,
                25
            );
        }, Number(audio_time));
    }

    function startSecondBookend() {
        if (!hasSpokenAudio) {
            window.setTimeout(
                showSecondBookend,
                audio_output_latency_ms
            );
            return;
        }

        stimulusAudio.currentTime = 0;

        $(stimulusAudio).one('playing', function() {
            window.setTimeout(
                showSecondBookend,
                audio_output_latency_ms
            );
        });

        playTrialAudio(
            stimulusAudio,
            'Repeated stimulus audio'
        );
    }

    function finishDelayTone() {
        delayAudio.pause();
        delayAudio.currentTime = 0;

        window.setTimeout(function() {
            $('#delay_text').hide();
            expectedTimes.delayEnd = Date.now();
        }, audio_output_latency_ms);

        window.setTimeout(
            startSecondBookend,
            25
        );
    }

    function startDelayTone() {
        delayAudio.currentTime = 0;

        $(delayAudio).one('playing', function() {
            window.setTimeout(function() {
                $('#stimuli_text').hide();
                $('#delay_text').show();
                expectedTimes.delayStart = Date.now();
            }, audio_output_latency_ms);

            window.setTimeout(
                finishDelayTone,
                Number(delay)
            );
        });

        playTrialAudio(delayAudio, 'Delay tone');
    }

    function startFirstBookendTimeline() {
        function startTimedSequence() {
            window.setTimeout(function() {
                $('#fixation').hide();
                $('#stimuli_text').show();
                expectedTimes.bookend1Start =
                    Date.now();
            }, audio_output_latency_ms);

            window.setTimeout(
                startDelayTone,
                Number(audio_time) + 525
            );
        }

        if (!hasSpokenAudio) {
            startTimedSequence();
            return;
        }

        stimulusAudio.currentTime = 0;

        $(stimulusAudio).one(
            'playing',
            startTimedSequence
        );

        playTrialAudio(
            stimulusAudio,
            'First stimulus audio'
        );
    }

    Phase.set_timer(function() {
        var requiredAudio = [delayAudio];

        if (hasSpokenAudio) {
            requiredAudio.push(stimulusAudio);
        }

        waitForTrialAudio(
            requiredAudio,
            startFirstBookendTimeline
        );
    }, 500);
    
    // Handle responses from buttons or keyboard
    function submitResponse(answer) {
        if (!responseEnabled || responseSubmitted) return;

        responseSubmitted = true;
        responseEnabled = false;

        var correctAnswer =
            Number(delay) === 400 ? 'short' : 'long';

        var isCorrect = answer === correctAnswer;
        var previousTrialCount =
            getTrainingCount(trainingTrialKey);
        var attemptCount =
            getTrainingCount(trainingAttemptKey);

        if (previousTrialCount === 0) {
            attemptCount++;
            Phase.set(trainingAttemptKey, attemptCount);
        }

        var correctCount =
            getTrainingCount(trainingCorrectKey) + (isCorrect ? 1 : 0);
        var trialCount = previousTrialCount + 1;

        Phase.set(trainingCorrectKey, correctCount);
        Phase.set(trainingTrialKey, trialCount);

        $('#response').val(answer);
        $('#training_correct').val(isCorrect ? '1' : '0');
        $('#training_attempts').val(attemptCount);
        $('#training_accuracy').val(
            (correctCount / trialCount) * 100
        );

        // Remove this trial's keyboard listeners before showing feedback
        removeKeyboardListeners();

        $('#response_options').hide();

        $('#training_feedback')
            .removeClass('text-success text-danger')
            .addClass(isCorrect ? 'text-success' : 'text-danger')
            .text(isCorrect ? 'Correct' : 'Incorrect')
            .show()
            .delay(300)
            .fadeOut(200, function() {
                finishTrainingResponse(correctCount, trialCount);
            });
    }
    
    // Button responses
    $('#response_short').click(function() {
        submitResponse('short');
    });
    
    $('#response_long').click(function() {
        submitResponse('long');
    });
    
    // Keyboard responses can originate in any level of Collector's nested iframes
    var keyboardDocuments = [document];

    try {
        if (window.parent !== window) {
            keyboardDocuments.push(window.parent.document);
        }

        if (window.top !== window && window.top !== window.parent) {
            keyboardDocuments.push(window.top.document);
        }
    } catch (error) {
        console.warn("Parent keyboard access unavailable:", error);
    }

    function handleKeyboardResponse(e) {
        if (!responseEnabled || responseSubmitted) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        var key = (
            e.key ||
            String.fromCharCode(e.which || e.keyCode)
        ).toLowerCase();

        if (key === 's') {
            submitResponse('short');
        } else if (key === 'l') {
            submitResponse('long');
        }
    }

    function removeKeyboardListeners() {
        keyboardDocuments.forEach(function(keyboardDocument) {
            keyboardDocument.removeEventListener(
                'keydown',
                handleKeyboardResponse
            );
        });
    }

    keyboardDocuments.forEach(function(keyboardDocument) {
        keyboardDocument.addEventListener(
            'keydown',
            handleKeyboardResponse
        );
    });

    window.addEventListener('unload', removeKeyboardListeners);

    // Function to check sync issues
    function checkSync() {
        let errorMessages = [];

        // Check the intervals actually experienced during the trial
        let actualBookend1Interval =
            expectedTimes.delayStart - expectedTimes.bookend1Start;

        let actualToneDuration =
            expectedTimes.delayEnd - expectedTimes.delayStart;

        let actualBookendTransition =
            expectedTimes.bookend2Start - expectedTimes.delayEnd;

        let actualBookend2Interval =
            expectedTimes.bookend2End - expectedTimes.bookend2Start;

        if (Math.abs(actualBookend1Interval - (Number(audio_time) + 525)) > 50) {
            errorMessages.push("First bookend interval mismatch.");
        }

        if (Math.abs(actualToneDuration - Number(delay)) > 50) {
            errorMessages.push("Tone duration mismatch.");
        }

        if (Math.abs(actualBookendTransition - 25) > 50) {
            errorMessages.push("Second bookend transition mismatch.");
        }

        if (Math.abs(actualBookend2Interval - Number(audio_time)) > 50) {
            errorMessages.push("Second bookend interval mismatch.");
        }

        if (errorMessages.length > 0) {
            sync_issue = true;
            $("#sync-issue").val("1");
            console.warn("Trial sync issue detected:", errorMessages);
        }
    }
</script>
</body>
