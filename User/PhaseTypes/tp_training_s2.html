<!-- Time Perception training trial setup (wording of response text is different to main) -->
<!--
---development---
[
{'visual':'Kettle','audio':'Sink','voice':'f', 'delay':'1600'}
]
---development---
-->
<style>
  body, html {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: white;
  }
  img {
    max-width: 100%;
    max-height: 100%;
  }
  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 72pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: uppercase;
  }
  #response_options  p {
    max-width: 100%;
    max-height: 100%;
    font-size: 16pt;
    font-family: "Times New Roman", Times, serif;
    text-transform: none;
  }
  #stimuli_text, #delay_text, #response_options {
    display: none;
  }
  .no_mouse{
    cursor: none;
  }
  .response-hint {
    font-family: "Times New Roman", Times, serif;
    font-size: 12pt;
    color: #666;
    margin-top: 6px;
  }
</style>
<body class="no_mouse">
  <input type='hidden' id='response' name='response'/>
  <input type="hidden" id="sync-issue" name="sync_issue" value="0">
  
  <!--HTML-->
  <p id="fixation">+</p>
  
  <p id="stimuli_text">{{visual}}</p>
  <audio id="stimuli_audio" src="../../collector-experiments/User/Assets/timeperception/audio/training_s2/{{audio}}_{{voice}}_{{delay}}.mp3"></audio>
  
  <audio id="delay_audio" src="../../collector-experiments/User/Assets/timeperception/audio/200.mp3"></audio>
  <p id="delay_text">—</p>
  
  <div id="response_options" class="text-center">
      <p>Did the audio tone last for a short (0.5 seconds) or long (1.5 seconds) length of time?</p>
      <br><br>
      <div class="d-flex justify-content-center gap-4">
          <div class="text-center">
              <button id="response_short" class="btn btn-outline-primary btn-lg">Short</button>
              <div class="response-hint">(or press S)</div>
          </div>
          <div class="text-center">
              <button id="response_long" class="btn btn-outline-primary btn-lg">Long</button>
              <div class="response-hint">(or press L)</div>
          </div>
      </div>
</div>

  <!--JAVASCRIPT-->
<script>
    var audio = '{{audio}}';
    var visual = '{{visual}}';
    var audio_time = '{{delay}}';

    var baselineTime;
    var sync_issue = false;  // Flag for timing or audio errors
    var audio_issue = false;
    var expectedTimes = {};

    function flagAudioIssue(audioName, error) {
        audio_issue = true;
        sync_issue = true;
        $("#sync-issue").val("1");
        console.warn(audioName + " failed to play:", error);
    }

    function playTrialAudio(audioElement, audioName) {
        var playPromise;

        try {
            playPromise = audioElement.play();
        } catch (error) {
            flagAudioIssue(audioName, error);
            return;
        }

        if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function(error) {
                flagAudioIssue(audioName, error);
            });
        }
    }

    $('#stimuli_audio').on('error', function() {
        flagAudioIssue(this.id, this.error || "Unknown media error");
    });

    Phase.set_timer(function () {
        baselineTime = Date.now();
        $("#sync-issue").val(audio_issue ? "1" : "0");
    }, 0);

    var runtime = 500;
    
    // Remove the written text from control trials
    if (visual == "Control") {
      $('#stimuli_text').html("");
    }

    // Show the stimulus and play the audio
    Phase.set_timer(function () {
        $('#fixation').hide();
        $('#stimuli_text').show();
        if (audio !== "control") {
            playTrialAudio($('#stimuli_audio')[0], 'Stimulus audio');
        }
        expectedTimes.bookend1Start = Date.now();
    }, runtime);

    runtime += Number(audio_time) + 50;

    // Hide the stimulus
    Phase.set_timer(function () {
        $('#stimuli_text').hide();
        expectedTimes.bookend1End = Date.now();
    }, runtime);

    runtime += 25;

    // Track whether responses are available
    var responseEnabled = false;
    var responseSubmitted = false;

    // Show response buttons
    Phase.set_timer(function () {
        $('body').removeClass('no_mouse');
        $('#response_options').show();
        checkSync(); // Optional sync check
        responseEnabled = true;
    }, runtime);

    // Handle responses from buttons or keyboard
    function submitResponse(answer) {
        if (!responseEnabled || responseSubmitted) return;

        responseSubmitted = true;
        responseEnabled = false;

        $('#response').val(answer);

        // Remove this trial's keyboard listeners before submitting
        removeKeyboardListeners();

        Phase.submit();
    }

    // Button responses
    $('#response_short').click(function () {
        submitResponse('short');
    });

    $('#response_long').click(function () {
        submitResponse('long');
    });

    // Keyboard responses can originate in any level of Collector's nested iframes
    var keyboardDocuments = [document];

    try {
        if (window.parent !== window) {
            keyboardDocuments.push(window.parent.document);
        }

        if (window.top !== window && window.top !== window.parent) {
            keyboardDocuments.push(window.top.document);
        }
    } catch (error) {
        console.warn("Parent keyboard access unavailable:", error);
    }

    function handleKeyboardResponse(e) {
        if (!responseEnabled || responseSubmitted) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        var key = (
            e.key ||
            String.fromCharCode(e.which || e.keyCode)
        ).toLowerCase();

        if (key === 's') {
            submitResponse('short');
        } else if (key === 'l') {
            submitResponse('long');
        }
    }

    function removeKeyboardListeners() {
        keyboardDocuments.forEach(function(keyboardDocument) {
            keyboardDocument.removeEventListener(
                'keydown',
                handleKeyboardResponse
            );
        });
    }

    keyboardDocuments.forEach(function(keyboardDocument) {
        keyboardDocument.addEventListener(
            'keydown',
            handleKeyboardResponse
        );
    });

    window.addEventListener('unload', removeKeyboardListeners);

    // Optional timing check (now simplified)
    function checkSync() {
        let errorMessages = [];

        // Check the stimulus duration actually experienced during the trial
        let actualStimulusDuration =
            expectedTimes.bookend1End - expectedTimes.bookend1Start;

        if (Math.abs(actualStimulusDuration - (Number(audio_time) + 50)) > 50) {
            errorMessages.push("Stimulus duration mismatch.");
        }

        if (errorMessages.length > 0) {
            sync_issue = true;
            $("#sync-issue").val("1");
            console.warn("Trial sync issue detected:", errorMessages);
        }
    }
</script>

</body>
